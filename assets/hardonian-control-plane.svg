<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="cp-title cp-desc">
  <title id="cp-title">Hardonian Control Plane Architecture</title>
  <desc id="cp-desc">Clean four-node architecture flow connecting the Hardonian Control Plane, FutureOS and FORGE execution, PostgreSQL RLS and zerokernel isolation, and the Settler Audit Ledger.</desc>

  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .flow {
        stroke-dasharray: 8 10;
        animation: move 2.6s linear infinite;
      }
      @keyframes move {
        to { stroke-dashoffset: -72; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow { animation: none; }
      }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Spacious Dark Canvas -->
  <rect width="960" height="420" rx="20" fill="#090d14"/>
  <rect width="960" height="420" rx="20" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="957" height="417" rx="18.5" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Flow Connectors -->
  <g fill="none" stroke-linecap="round">
    <!-- Top to Left & Right -->
    <path d="M 340 118 L 250 118 L 250 166" stroke="#38bdf8" stroke-width="3.5" class="flow"/>
    <path d="M 620 118 L 710 118 L 710 166" stroke="#818cf8" stroke-width="3.5" class="flow"/>

    <!-- Left & Right to Bottom -->
    <path d="M 250 262 L 250 310 L 340 310" stroke="#34d399" stroke-width="3.5" class="flow"/>
    <path d="M 710 262 L 710 310 L 620 310" stroke="#34d399" stroke-width="3.5" class="flow"/>
  </g>

  <!-- NODE 1: TOP (CONTROL PLANE) -->
  <g transform="translate(240, 36)" text-anchor="middle">
    <rect width="480" height="86" rx="14" fill="#111827" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="240" y="38" class="sans" fill="#ffffff" font-size="21" font-weight="800">HARDONIAN CONTROL PLANE</text>
    <text x="240" y="65" class="mono" fill="#5eead4" font-size="14.5" font-weight="600">MCP Policy Gate · Hard Quotas · Model Routing</text>
  </g>

  <!-- NODE 2A: MIDDLE LEFT (EXECUTION) -->
  <g transform="translate(60, 166)" text-anchor="middle">
    <rect width="380" height="96" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="190" y="42" class="sans" fill="#ffffff" font-size="20" font-weight="800">FUTUREOS &amp; FORGE</text>
    <text x="190" y="70" class="mono" fill="#7dd3fc" font-size="14.5" font-weight="600">Isolated Workers · Idempotent Jobs</text>
  </g>

  <!-- NODE 2B: MIDDLE RIGHT (KERNEL ISOLATION) -->
  <g transform="translate(520, 166)" text-anchor="middle">
    <rect width="380" height="96" rx="14" fill="#111827" stroke="#818cf8" stroke-width="2.5"/>
    <text x="190" y="42" class="sans" fill="#ffffff" font-size="20" font-weight="800">POSTGRES RLS &amp; eBPF</text>
    <text x="190" y="70" class="mono" fill="#c4b5fd" font-size="14.5" font-weight="600">Tenant Kernel Policy · ZK Sandboxing</text>
  </g>

  <!-- NODE 3: BOTTOM (PROOF & LEDGER) -->
  <g transform="translate(240, 298)" text-anchor="middle">
    <rect width="480" height="86" rx="14" fill="#111827" stroke="#34d399" stroke-width="2.5"/>
    <text x="240" y="38" class="sans" fill="#ffffff" font-size="21" font-weight="800">SETTLER AUDIT LEDGER</text>
    <text x="240" y="65" class="mono" fill="#6ee7b7" font-size="14.5" font-weight="600">Cryptographic Proof · Reconciliation · Replay</text>
  </g>
</svg>

