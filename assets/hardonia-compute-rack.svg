<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="rack-title rack-desc">
  <title id="rack-title">Hardonia Owned Compute &amp; GPU Inference Lab Topology</title>
  <desc id="rack-desc">Private hardware testbed topology combining AMD EPYC 7452 server compute, AMD Ryzen AI 9 HX370 NPU/GPU, NVIDIA V100, P40, and RTX 3060 accelerators, Ollama-compatible routing, ComfyUI, and Prometheus/OpenTelemetry observability.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .pcie-bus {
        stroke-dasharray: 6 10;
        animation: bus-flow 2.8s linear infinite;
      }
      .led-blink {
        animation: led-pulse 2.2s ease-in-out infinite;
      }
      @keyframes bus-flow {
        to { stroke-dashoffset: -64; }
      }
      @keyframes led-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pcie-bus, .led-blink { animation: none; }
      }
    </style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <linearGradient id="blade-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#minor-grid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#334155" stroke-width="0.9" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Outer Chassis -->
  <rect width="1600" height="520" rx="18" fill="url(#bg-grad)"/>
  <rect width="1600" height="520" rx="18" fill="url(#major-grid)"/>
  <rect x="1" y="1" width="1598" height="518" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="12" y="12" width="1576" height="496" rx="11" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Corner Fiducial Crosshairs -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.7">
    <path d="M 24 30 L 36 30 M 30 24 L 30 36"/>
    <path d="M 1564 30 L 1576 30 M 1570 24 L 1570 36"/>
    <path d="M 24 490 L 36 490 M 30 484 L 30 496"/>
    <path d="M 1564 490 L 1576 490 M 1570 484 L 1570 496"/>
  </g>

  <!-- Header -->
  <g transform="translate(48, 42)">
    <rect x="0" y="-15" width="9" height="17" rx="2" fill="#34d399"/>
    <text x="18" y="-1" class="mono" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="2.5">PRIVATE COMPUTE &amp; INFERENCE TESTBED // RACK TOPOLOGY</text>
    <text x="548" y="-1" class="mono" fill="#64748b" font-size="12" letter-spacing="1.2">│  OWNED SILICON  │  QUANTIZED ROUTING · FAILURE-MODE HARNESS</text>
    <text x="1504" y="-1" class="mono" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="end" letter-spacing="1.5">3 GPU LANES + XDNA 2 NPU ONLINE</text>
  </g>
  <line x1="48" y1="60" x2="1552" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- ======================================================================= -->
  <!-- LEFT SIDE: PHYSICAL SERVER RACK & SILICON BLADES                        -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 80)">
    <rect width="740" height="384" rx="10" fill="#080c14" stroke="#334155" stroke-width="1.5"/>

    <!-- Rack Mounting Rails -->
    <line x1="22" y1="0" x2="22" y2="384" stroke="#1e293b" stroke-width="1"/>
    <line x1="718" y1="0" x2="718" y2="384" stroke="#1e293b" stroke-width="1"/>

    <text x="38" y="28" class="mono" fill="#94a3b8" font-size="11.5" font-weight="700" letter-spacing="2">RACK ENCLOSURE 01 // OWNED HARDWARE FLEET</text>
    <text x="702" y="28" class="mono" fill="#475569" font-size="11" text-anchor="end">PCIe 4.0 INTERCONNECT</text>

    <!-- BLADE 1U: AMD EPYC 7452 -->
    <g transform="translate(36, 44)">
      <rect width="668" height="84" rx="7" fill="url(#blade-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="4" fill="#38bdf8" class="led-blink"/>
      <text x="34" y="28" class="mono" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.5">BLADE 01 // HOST COMPUTE SPINE</text>
      <text x="648" y="28" class="mono" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="end">32 CORES / 64 THREADS</text>
      <text x="34" y="52" class="sans" fill="#f8fafc" font-size="18" font-weight="700">AMD EPYC 7452 Server Platform</text>
      <text x="34" y="71" class="mono" fill="#94a3b8" font-size="11">128 PCIe 4.0 Lanes · Multi-Channel ECC Memory · Container &amp; KVM Hypervisor Host</text>
    </g>

    <!-- BLADE 2U: MULTI-GPU ACCELERATOR POOL -->
    <g transform="translate(36, 142)">
      <rect width="668" height="128" rx="7" fill="url(#blade-grad)" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="4" fill="#34d399" class="led-blink"/>
      <text x="34" y="28" class="mono" fill="#34d399" font-size="11.5" font-weight="700" letter-spacing="1.5">BLADE 02 // CUDA ACCELERATOR POOL (3 DEDICATED LANES)</text>
      <text x="648" y="28" class="mono" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="end">52 GB COMBINED VRAM</text>

      <!-- 3 GPU Cards -->
      <g transform="translate(20, 42)">
        <rect width="200" height="70" rx="5" fill="#061613" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="22" class="mono" fill="#34d399" font-size="11" font-weight="700">NVIDIA Tesla V100</text>
        <text x="14" y="40" class="mono" fill="#cbd5e1" font-size="10">Volta · HBM2 Memory</text>
        <text x="14" y="56" class="mono" fill="#64748b" font-size="9.5">FP16 / FP64 Tensor</text>
      </g>

      <g transform="translate(234, 42)">
        <rect width="200" height="70" rx="5" fill="#061613" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="22" class="mono" fill="#34d399" font-size="11" font-weight="700">NVIDIA Tesla P40</text>
        <text x="14" y="40" class="mono" fill="#cbd5e1" font-size="10">24 GB GDDR5 VRAM</text>
        <text x="14" y="56" class="mono" fill="#64748b" font-size="9.5">Quantized LLM Weights</text>
      </g>

      <g transform="translate(448, 42)">
        <rect width="200" height="70" rx="5" fill="#061613" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="22" class="mono" fill="#34d399" font-size="11" font-weight="700">NVIDIA RTX 3060</text>
        <text x="14" y="40" class="mono" fill="#cbd5e1" font-size="10">12 GB GDDR6 Ampere</text>
        <text x="14" y="56" class="mono" fill="#64748b" font-size="9.5">ComfyUI · Diffusion</text>
      </g>
    </g>

    <!-- BLADE 3U: RYZEN AI 9 HX370 + ARM64 PARITY -->
    <g transform="translate(36, 284)">
      <rect width="668" height="84" rx="7" fill="url(#blade-grad)" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="20" cy="24" r="4" fill="#818cf8" class="led-blink"/>
      <text x="34" y="28" class="mono" fill="#818cf8" font-size="11.5" font-weight="700" letter-spacing="1.5">BLADE 03 // NPU &amp; AARCH64 EDGE PARITY NODE</text>
      <text x="648" y="28" class="mono" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="end">XDNA 2 NPU + ARM64</text>
      <text x="34" y="52" class="sans" fill="#f8fafc" font-size="18" font-weight="700">AMD Ryzen AI 9 HX370 + Local AArch64 Runtime</text>
      <text x="34" y="71" class="mono" fill="#94a3b8" font-size="11">Low-Power NPU/iGPU Inference · Termux ARM64 ↔ Edge WASM Validation</text>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- INTERCONNECT BUS (RACK -> RUNTIME SERVICES)                             -->
  <!-- ======================================================================= -->
  <g fill="none">
    <line x1="788" y1="166" x2="872" y2="166" stroke="#1e293b" stroke-width="3"/>
    <line x1="788" y1="166" x2="872" y2="166" stroke="#38bdf8" stroke-width="2" class="pcie-bus"/>

    <line x1="788" y1="286" x2="872" y2="286" stroke="#1e293b" stroke-width="3"/>
    <line x1="788" y1="286" x2="872" y2="286" stroke="#34d399" stroke-width="2" class="pcie-bus"/>

    <line x1="788" y1="406" x2="872" y2="406" stroke="#1e293b" stroke-width="3"/>
    <line x1="788" y1="406" x2="872" y2="406" stroke="#f59e0b" stroke-width="2" class="pcie-bus"/>
  </g>

  <!-- ======================================================================= -->
  <!-- RIGHT SIDE: WORKLOAD ROUTING, CHAOS TESTING & OBSERVABILITY             -->
  <!-- ======================================================================= -->
  <g transform="translate(872, 80)">
    <!-- Service Plane 1: Model Routing -->
    <g transform="translate(0, 0)">
      <rect width="680" height="116" rx="10" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="4" height="116" rx="2" fill="#38bdf8"/>
      <text x="24" y="28" class="mono" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">PLANE A // LOCAL MODEL ROUTING &amp; QUANTIZATION</text>
      <text x="656" y="28" class="mono" fill="#64748b" font-size="11" text-anchor="end">Hardonian/model-tools</text>
      <text x="24" y="54" class="sans" fill="#f8fafc" font-size="18" font-weight="700">Ollama-Compatible Multi-GPU Router</text>
      <text x="24" y="76" class="sans" fill="#94a3b8" font-size="13">Dynamic model pinning across V100/P40/3060 lanes with token-spend &amp; latency telemetry.</text>
      <text x="24" y="98" class="mono" fill="#2dd4bf" font-size="11">GGUF / AWQ Quantization  ·  Deterministic Context Caps  ·  Fallback Circuit Breakers</text>
    </g>

    <!-- Service Plane 2: Autonomous Workflows -->
    <g transform="translate(0, 134)">
      <rect width="680" height="116" rx="10" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="4" height="116" rx="2" fill="#34d399"/>
      <text x="24" y="28" class="mono" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5">PLANE B // GENERATIVE PIPELINES &amp; BATCH AUTOMATION</text>
      <text x="656" y="28" class="mono" fill="#64748b" font-size="11" text-anchor="end">Hardonian/autopilot</text>
      <text x="24" y="54" class="sans" fill="#f8fafc" font-size="18" font-weight="700">ComfyUI DAG Execution &amp; Media Synthesis</text>
      <text x="24" y="76" class="sans" fill="#94a3b8" font-size="13">Containerized image/video synthesis pipelines with idempotent job queues and artifact hashing.</text>
      <text x="24" y="98" class="mono" fill="#34d399" font-size="11">Isolated Worker Containers  ·  Reproducible Seeds  ·  Zero-Toil Batch Dispatch</text>
    </g>

    <!-- Service Plane 3: Failure Mode & Observability -->
    <g transform="translate(0, 268)">
      <rect width="680" height="116" rx="10" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="4" height="116" rx="2" fill="#f59e0b"/>
      <text x="24" y="28" class="mono" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1.5">PLANE C // FAILURE-MODE HARNESS &amp; OBSERVABILITY</text>
      <text x="656" y="28" class="mono" fill="#64748b" font-size="11" text-anchor="end">Hardonian/api-tools</text>
      <text x="24" y="54" class="sans" fill="#f8fafc" font-size="18" font-weight="700">Prometheus · Grafana · OpenTelemetry Trace Bus</text>
      <text x="24" y="76" class="sans" fill="#94a3b8" font-size="13">Adversarial testing for OOM pressure, thermal throttling, upstream timeouts, and schema drift.</text>
      <text x="24" y="98" class="mono" fill="#fbbf24" font-size="11">GPU VRAM Telemetry  ·  Sub-ms Trace Propagation  ·  Replayable Incident Logs</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(48, 492)" class="mono" font-size="11" fill="#475569" letter-spacing="1.2">
    <text x="0" y="0">LAB_STATUS: OPERATIONAL // ZERO EXTERNAL CLOUD DEPENDENCY FOR CORE EVALS</text>
    <text x="1504" y="0" text-anchor="end" fill="#64748b">PUBLIC REPOS: MODEL-TOOLS · AUTOPILOT · API-TOOLS</text>
  </g>
</svg>

