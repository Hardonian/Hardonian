<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="bento-title bento-desc">
  <title id="bento-title">Hardonia Flagship Engineering Portfolio — Six Production Domains</title>
  <desc id="bento-desc">High-contrast two-column architectural grid covering ReadyLayer, FORGE, Settler, TokenGoblin, TokPulse, veridag, zerokernel, XLAxiom, GRAPH-Lab, and SAT-Frontier.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @media (prefers-color-scheme: light) {
        .chassis-border { stroke: #0f172a; stroke-width: 3; }
      }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Outer Chassis -->
  <rect width="960" height="780" rx="18" fill="url(#bg-grad)"/>
  <rect width="960" height="780" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="956" height="776" rx="16" fill="none" stroke="#334155" stroke-width="2.5" class="chassis-border"/>

  <!-- Header -->
  <g transform="translate(36, 44)">
    <rect x="0" y="-16" width="10" height="18" rx="2" fill="#38bdf8"/>
    <text x="18" y="-1" class="mono" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">FLAGSHIP SYSTEMS // 6 BOUNDED ENGINEERING DOMAINS</text>
    <text x="888" y="-1" class="mono" fill="#6ee7b7" font-size="13.5" font-weight="700" text-anchor="end" letter-spacing="1">PUBLIC PROOF · CI VERIFIED</text>
  </g>
  <line x1="36" y1="62" x2="924" y2="62" stroke="#334155" stroke-width="1.5"/>

  <!-- ======================================================================= -->
  <!-- CARD 01: AI PLATFORM & AGENT GOVERNANCE (ROW 1, LEFT)                   -->
  <!-- ======================================================================= -->
  <g transform="translate(36, 82)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1">01 // AI PLATFORM &amp; GOVERNANCE</text>
    <rect x="314" y="14" width="98" height="26" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="363" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">TS · Go · Rust</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">ReadyLayer · FORGE v1.0</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">Unprivileged model planning behind MCP policy gates,</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">1-use capability tokens, and full agent lifecycle CI.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#071526" stroke="#0284c7" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">PLANNER (0 SECRETS) ──► MCP GATE ──► ALLOW + AUDIT</text>
    </g>

    <text x="22" y="186" class="mono" fill="#7dd3fc" font-size="13" font-weight="700">REPOS: ReadyLayer · FORGE (v1.0.0 GA) · agent-infra</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 02: MULTI-TENANT RLS & RECONCILIATION (ROW 1, RIGHT)               -->
  <!-- ======================================================================= -->
  <g transform="translate(492, 82)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#34d399" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#6ee7b7" font-size="13" font-weight="700" letter-spacing="1">02 // MULTI-TENANT KERNEL &amp; LEDGER</text>
    <rect x="308" y="14" width="104" height="26" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">v1.8.0 STABLE</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">Settler v1.8.0</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">PostgreSQL RLS tenant isolation enforced in the DB kernel</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">with 20+ CI gates, negative tests, and ledger snapshots.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#04241c" stroke="#10b981" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">PG FORCE RLS ──► 0 CROSS-TENANT LEAKS ──► SEALED</text>
    </g>

    <text x="22" y="186" class="mono" fill="#6ee7b7" font-size="13" font-weight="700">REPOS: Settler (v1.8.0 Stable) · ControlPlane</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 03: INFERENCE ECONOMICS & OBSERVABILITY (ROW 2, LEFT)              -->
  <!-- ======================================================================= -->
  <g transform="translate(36, 310)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#fde047" font-size="13" font-weight="700" letter-spacing="1">03 // INFERENCE FINOPS &amp; TELEMETRY</text>
    <rect x="314" y="14" width="98" height="26" rx="6" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="363" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Go · v3.0.0</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">TokenGoblin · TokPulse v3.0</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">Sub-millisecond token ingestion, hard spend circuit</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">breakers, Prometheus alerting, and fallback routing.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#291205" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#fef08a" font-size="12.5" font-weight="700" text-anchor="middle">SUB-MS INGEST ──► HARD QUOTA CAP ──► AUTO FALLBACK</text>
    </g>

    <text x="22" y="186" class="mono" fill="#fde047" font-size="13" font-weight="700">REPOS: TokenGoblin · TokPulse (v3.0.0 GA)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 04: DISTRIBUTED EXECUTION & KERNEL SANDBOX (ROW 2, RIGHT)          -->
  <!-- ======================================================================= -->
  <g transform="translate(492, 310)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1">04 // FORMAL DAG &amp; ZK eBPF SANDBOX</text>
    <rect x="310" y="14" width="102" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="361" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Rust · Quint</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">veridag · zerokernel v1.0</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">Quint-verified causal DAG execution, ZK-proved eBPF</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">kernel sandboxing, and synaptic backpressure loops.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#151336" stroke="#6366f1" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#e0e7ff" font-size="12.5" font-weight="700" text-anchor="middle">QUINT SPEC ✓ ──► ZK eBPF SANDBOX ──► CONFORMANCE</text>
    </g>

    <text x="22" y="186" class="mono" fill="#c4b5fd" font-size="13" font-weight="700">REPOS: veridag · zerokernel (v1.0) · ControlPlane</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 05: ML COMPILERS & NUMERICAL QUALITY (ROW 3, LEFT)                 -->
  <!-- ======================================================================= -->
  <g transform="translate(36, 538)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#2dd4bf" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1">05 // ML COMPILER NUMERICAL QUALITY</text>
    <rect x="304" y="14" width="108" height="26" rx="6" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="358" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">JAX · OpenXLA</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">XLAxiom</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">Automated HLO computation graph delta-minimization</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">turning JAX/OpenXLA numerical bugs into tiny reproducers.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#042222" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#99f6e4" font-size="12.5" font-weight="700" text-anchor="middle">1000-OP HLO GRAPH ──► Δ-SLICER ──► MINIMAL WITNESS</text>
    </g>

    <text x="22" y="186" class="mono" fill="#5eead4" font-size="13" font-weight="700">REPO: XLAxiom (HLO Delta-Minimizer &amp; Tolerance Oracles)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 06: FORMAL METHODS, SAT & LEAN 4 (ROW 3, RIGHT)                    -->
  <!-- ======================================================================= -->
  <g transform="translate(492, 538)">
    <rect width="432" height="206" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-width="2"/>
    <text x="22" y="32" class="mono" fill="#e9d5ff" font-size="13" font-weight="700" letter-spacing="1">06 // FORMAL METHODS &amp; SAT SOLVING</text>
    <rect x="304" y="14" width="108" height="26" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
    <text x="358" y="31" class="mono" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Lean 4 · SAT</text>

    <text x="22" y="66" class="sans" fill="#ffffff" font-size="22" font-weight="800">GRAPH-Lab · SAT-Frontier</text>
    <text x="22" y="92" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">Exact combinatorial counterexample search, automated</text>
    <text x="22" y="112" class="sans" fill="#e2e8f0" font-size="14.5" font-weight="500">SAT reasoning, and Lean 4 kernel-checked witnesses.</text>

    <!-- High-Contrast Flow Banner -->
    <g transform="translate(22, 128)">
      <rect width="388" height="34" rx="6" fill="#1e0b3b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="194" y="22" class="mono" fill="#f3e8ff" font-size="12.5" font-weight="700" text-anchor="middle">EXACT SEARCH + SAT ──► LEAN 4 KERNEL ──► ⊢ QED</text>
    </g>

    <text x="22" y="186" class="mono" fill="#e9d5ff" font-size="13" font-weight="700">REPOS: GRAPH-Lab · SAT-Frontier (v0.2.9)</text>
  </g>
</svg>
