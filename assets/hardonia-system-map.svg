<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Hardonia production AI systems map</title>
  <desc id="desc">A production system loop spanning observation, control, execution, proof, and reconciliation.</desc>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .flow-pulse {
        stroke-dasharray: 8 16;
        animation: flow-shift 3.6s linear infinite;
      }
      .evidence-pulse {
        stroke-dasharray: 8 4;
        animation: evidence-shift 4.5s linear infinite;
      }
      @keyframes flow-shift {
        to { stroke-dashoffset: -72; }
      }
      @keyframes evidence-shift {
        to { stroke-dashoffset: 48; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-pulse, .evidence-pulse { animation: none; }
      }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="jev-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#minor-grid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#334155" stroke-width="0.9" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jev-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="18" fill="url(#bg-grad)"/>
  <rect width="1600" height="520" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1598" height="518" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="12" y="12" width="1576" height="496" rx="11" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Corner Fiducial Crosshairs -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.7">
    <path d="M 24 30 L 36 30 M 30 24 L 30 36"/>
    <path d="M 1564 30 L 1576 30 M 1570 24 L 1570 36"/>
    <path d="M 24 490 L 36 490 M 30 484 L 30 496"/>
    <path d="M 1564 490 L 1576 490 M 1570 484 L 1570 496"/>
  </g>

  <g class="sans">
    <!-- Header -->
    <g transform="translate(88, 66)">
      <rect x="0" y="-13" width="8" height="14" rx="1.5" fill="#38bdf8"/>
      <text x="18" y="-1" class="mono" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="4">SOVEREIGN SYSTEMS // PRODUCTION AI</text>
    </g>
    <text x="84" y="152" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="-3">HARDONIA</text>
    <text x="88" y="196" fill="#94a3b8" font-size="21" font-weight="450">Local compute. Deterministic control. Verifiable outcomes.</text>

    <!-- Evidence badge -->
    <g transform="translate(1258, 54)">
      <rect width="254" height="58" rx="10" fill="#120d08" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8" filter="url(#jev-glow-filter)"/>
      <rect x="16" y="15" width="28" height="28" rx="6" fill="#1c1208" stroke="#fb923c" stroke-width="1.5"/>
      <text x="30" y="34" class="mono" fill="#fb923c" font-size="15" font-weight="800" text-anchor="middle">H</text>
      <text x="58" y="26" class="mono" fill="#fde68a" font-size="11.5" font-weight="700" letter-spacing="2">EVIDENCE FIRST</text>
      <text x="58" y="44" class="mono" fill="#fed7aa" font-size="13.5" font-weight="600" letter-spacing="0.5">PUBLIC PROOF · CI GATED</text>
    </g>

    <!-- System map label -->
    <text x="1512" y="138" class="mono" fill="#64748b" font-size="12" font-weight="600" text-anchor="end" letter-spacing="2">SYSTEM TOPOLOGY // REV 04</text>

    <!-- Main flow line -->
    <line x1="98" y1="340" x2="1502" y2="340" stroke="#1e293b" stroke-width="3"/>
    <line x1="98" y1="340" x2="1502" y2="340" stroke="url(#line)" stroke-width="2.5"/>
    <line x1="98" y1="340" x2="1502" y2="340" stroke="#7dd3fc" stroke-width="2" class="flow-pulse"/>

    <!-- Control and evidence line (parallel, below) -->
    <line x1="98" y1="406" x2="1502" y2="406" stroke="#451a03" stroke-width="1.5"/>
    <line x1="98" y1="406" x2="1502" y2="406" stroke="url(#jev-glow)" stroke-width="2" class="evidence-pulse"/>

    <!-- Control and evidence label -->
    <text x="800" y="440" class="mono" fill="#fb923c" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="3">CONTROL + EVIDENCE BUS — ROUTE · GATE · REPLAY · RECONCILE</text>

    <!-- Vertical connectors from flow to control and evidence layer -->
    <g stroke="#f97316" stroke-width="1.2" opacity="0.45" stroke-dasharray="3 3">
      <line x1="160" y1="348" x2="160" y2="402"/>
      <line x1="480" y1="348" x2="480" y2="402"/>
      <line x1="800" y1="348" x2="800" y2="402"/>
      <line x1="1120" y1="348" x2="1120" y2="402"/>
      <line x1="1440" y1="348" x2="1440" y2="402"/>
    </g>

    <!-- Control and evidence dots -->
    <g fill="#fb923c" opacity="0.8">
      <circle cx="160" cy="406" r="4"/>
      <circle cx="480" cy="406" r="4"/>
      <circle cx="800" cy="406" r="4"/>
      <circle cx="1120" cy="406" r="4"/>
      <circle cx="1440" cy="406" r="4"/>
    </g>

    <!-- Flow nodes -->
    <g class="mono">
      <!-- 01 OBSERVE -->
      <g transform="translate(160, 340)">
        <rect x="-112" y="-82" width="224" height="58" rx="8" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
        <text x="-94" y="-58" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1.5">01 // OBSERVE</text>
        <text x="-94" y="-38" class="sans" fill="#cbd5e1" font-size="13" font-weight="500">traffic · token spend · state</text>
        <circle r="7" fill="#090d14" stroke="#2dd4bf" stroke-width="3"/>
      </g>

      <!-- 02 CONTROL -->
      <g transform="translate(480, 340)">
        <rect x="-112" y="-82" width="224" height="58" rx="8" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
        <text x="-94" y="-58" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">02 // CONTROL</text>
        <text x="-94" y="-38" class="sans" fill="#cbd5e1" font-size="13" font-weight="500">MCP policy · routing · limits</text>
        <circle r="7" fill="#090d14" stroke="#38bdf8" stroke-width="3"/>
      </g>

      <!-- 03 EXECUTE -->
      <g transform="translate(800, 340)">
        <rect x="-116" y="-84" width="232" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="-96" y="-59" fill="#f8fafc" font-size="11.5" font-weight="700" letter-spacing="1.5">03 // EXECUTE</text>
        <text x="-96" y="-38" class="sans" fill="#e2e8f0" font-size="13" font-weight="600">isolated · RLS · idempotent</text>
        <circle r="8" fill="#090d14" stroke="#7dd3fc" stroke-width="3" filter="url(#glow)"/>
      </g>

      <!-- 04 PROVE -->
      <g transform="translate(1120, 340)">
        <rect x="-112" y="-82" width="224" height="58" rx="8" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
        <text x="-94" y="-58" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="1.5">04 // PROVE</text>
        <text x="-94" y="-38" class="sans" fill="#cbd5e1" font-size="13" font-weight="500">formal models · replay log</text>
        <circle r="7" fill="#090d14" stroke="#818cf8" stroke-width="3"/>
      </g>

      <!-- 05 RECONCILE -->
      <g transform="translate(1440, 340)">
        <rect x="-112" y="-82" width="224" height="58" rx="8" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
        <text x="-94" y="-58" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5">05 // RECONCILE</text>
        <text x="-94" y="-38" class="sans" fill="#cbd5e1" font-size="13" font-weight="500">ledger finality · audit</text>
        <circle r="7" fill="#090d14" stroke="#34d399" stroke-width="3"/>
      </g>
    </g>

    <!-- GPU fleet indicator -->
    <g transform="translate(88, 480)" class="mono" font-size="11.5">
      <circle cx="6" cy="-4" r="3.5" fill="#34d399"/>
      <text x="18" y="0" fill="#34d399" font-weight="700" letter-spacing="1.5">OWNED COMPUTE FLEET</text>
      <text x="208" y="0" fill="#64748b">EPYC 7452 · RYZEN AI 9 HX370 · V100 / P40 / RTX 3060 · AARCH64 EDGE PARITY</text>
      <text x="1424" y="0" fill="#475569" text-anchor="end">TORONTO, CA</text>
    </g>
  </g>
</svg>
