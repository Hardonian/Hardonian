<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Hardonia production AI systems map</title>
  <desc id="desc">A production system loop spanning observation, control, execution, proof, and reconciliation.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Spacious Dark Canvas -->
  <rect width="960" height="360" rx="20" fill="#090d14"/>
  <rect width="960" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="957" height="357" rx="18.5" fill="none" stroke="#334155" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Top Kicker -->
    <text x="56" y="56" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="4">SOVEREIGN AI SYSTEMS</text>

    <!-- Main Hero Title -->
    <text x="52" y="124" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2.5">HARDONIA</text>
    <text x="56" y="162" fill="#e2e8f0" font-size="20" font-weight="500">Local compute. Deterministic control. Verifiable outcomes.</text>

    <!-- Minimal High-Contrast Pill (Top Right) -->
    <g transform="translate(684, 48)">
      <rect width="220" height="48" rx="24" fill="#06281e" stroke="#34d399" stroke-width="2"/>
      <circle cx="28" cy="24" r="6" fill="#34d399" filter="url(#glow)"/>
      <text x="46" y="29" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="1.5">PUBLIC PROOF · CI</text>
    </g>

    <!-- =================================================================== -->
    <!-- SPACIOUS 5-NODE PIPELINE (NO CROWDED TEXT BOXES)                    -->
    <!-- =================================================================== -->
    <line x1="104" y1="256" x2="856" y2="256" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="104" y1="256" x2="856" y2="256" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

    <!-- Node 1: OBSERVE -->
    <g transform="translate(104, 256)" text-anchor="middle">
      <text y="-28" fill="#5eead4" font-size="16" font-weight="800" letter-spacing="1">OBSERVE</text>
      <circle r="11" fill="#090d14" stroke="#2dd4bf" stroke-width="4"/>
      <circle r="4" fill="#2dd4bf"/>
      <text y="38" fill="#f1f5f9" font-size="15" font-weight="600">Spend &amp; Traces</text>
    </g>

    <!-- Node 2: CONTROL -->
    <g transform="translate(292, 256)" text-anchor="middle">
      <text y="-28" fill="#7dd3fc" font-size="16" font-weight="800" letter-spacing="1">CONTROL</text>
      <circle r="11" fill="#090d14" stroke="#38bdf8" stroke-width="4"/>
      <circle r="4" fill="#38bdf8"/>
      <text y="38" fill="#f1f5f9" font-size="15" font-weight="600">MCP Policy Gate</text>
    </g>

    <!-- Node 3: EXECUTE -->
    <g transform="translate(480, 256)" text-anchor="middle">
      <text y="-28" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="1">EXECUTE</text>
      <circle r="13" fill="#090d14" stroke="#7dd3fc" stroke-width="4" filter="url(#glow)"/>
      <circle r="5" fill="#ffffff"/>
      <text y="38" fill="#ffffff" font-size="15" font-weight="700">Postgres RLS</text>
    </g>

    <!-- Node 4: PROVE -->
    <g transform="translate(668, 256)" text-anchor="middle">
      <text y="-28" fill="#c4b5fd" font-size="16" font-weight="800" letter-spacing="1">PROVE</text>
      <circle r="11" fill="#090d14" stroke="#a78bfa" stroke-width="4"/>
      <circle r="4" fill="#a78bfa"/>
      <text y="38" fill="#f1f5f9" font-size="15" font-weight="600">Formal Models</text>
    </g>

    <!-- Node 5: RECONCILE -->
    <g transform="translate(856, 256)" text-anchor="middle">
      <text y="-28" fill="#6ee7b7" font-size="16" font-weight="800" letter-spacing="1">RECONCILE</text>
      <circle r="11" fill="#090d14" stroke="#34d399" stroke-width="4"/>
      <circle r="4" fill="#34d399"/>
      <text y="38" fill="#f1f5f9" font-size="15" font-weight="600">Audit Ledger</text>
    </g>
  </g>
</svg>
