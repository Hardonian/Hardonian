<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Hardonia Sovereign Systems — JEV-Powered Decision Layer</title>
  <desc id="desc">System map showing JEV as the decision engine between every layer of the Hardonia platform.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="0.48" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="jev-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jev-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="24" fill="#090d14"/>
  <rect x="1" y="1" width="1598" height="518" rx="23" fill="none" stroke="#263140" stroke-width="2"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)" opacity="0.28"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <!-- Header -->
    <text x="88" y="78" fill="#7dd3fc" font-size="17" font-weight="700" letter-spacing="5">SOVEREIGN SYSTEMS</text>
    <text x="84" y="158" fill="#f8fafc" font-size="78" font-weight="750" letter-spacing="-3">HARDONIA</text>
    <text x="88" y="200" fill="#94a3b8" font-size="22" font-weight="450">Local compute. Deterministic control. Verifiable outcomes.</text>

    <!-- JEV Badge -->
    <g transform="translate(1270, 58)">
      <rect width="230" height="56" rx="28" fill="#1a0f05" stroke="#f97316" stroke-width="2" filter="url(#jev-glow-filter)"/>
      <circle cx="32" cy="28" r="14" fill="none" stroke="#fb923c" stroke-width="2"/>
      <text x="32" y="33" fill="#fb923c" font-size="16" font-weight="800" text-anchor="middle">J</text>
      <text x="56" y="25" fill="#fde68a" font-size="13" font-weight="700" letter-spacing="2">POWERED BY</text>
      <text x="56" y="43" fill="#fed7aa" font-size="16" font-weight="600">TypeSafe JEV · $0.042/1M</text>
    </g>

    <!-- System map label -->
    <text x="1270" y="143" fill="#64748b" font-size="14" font-weight="600" letter-spacing="2">SYSTEM MAP / 01</text>

    <!-- Main flow line -->
    <line x1="98" y1="370" x2="1502" y2="370" stroke="#334155" stroke-width="2"/>
    <line x1="98" y1="370" x2="1502" y2="370" stroke="url(#line)" stroke-width="3"/>

    <!-- JEV decision line (parallel, below) -->
    <line x1="98" y1="420" x2="1502" y2="420" stroke="#7c2d12" stroke-width="1.5" stroke-dasharray="8 4"/>
    <line x1="98" y1="420" x2="1502" y2="420" stroke="url(#jev-glow)" stroke-width="2" stroke-dasharray="8 4"/>

    <!-- JEV label -->
    <text x="800" y="450" fill="#fb923c" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3">JEV DECISION LAYER — CLASSIFIES · ROUTES · GATES · VERIFIES</text>

    <!-- Flow nodes -->
    <g font-size="14" font-weight="700" letter-spacing="1.5">
      <g transform="translate(98 370)">
        <circle r="8" fill="#090d14" stroke="#5eead4" stroke-width="3"/>
        <text x="0" y="-25" fill="#cbd5e1">01 / OBSERVE</text>
        <text x="0" y="44" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0">traffic · cost · state</text>
      </g>
      <g transform="translate(449 370)">
        <circle r="8" fill="#090d14" stroke="#67e8f9" stroke-width="3"/>
        <text x="0" y="-25" fill="#cbd5e1">02 / CONTROL</text>
        <text x="0" y="44" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0">policy · routing · limits</text>
      </g>
      <g transform="translate(800 370)">
        <circle r="8" fill="#090d14" stroke="#7dd3fc" stroke-width="3" filter="url(#glow)"/>
        <text x="0" y="-25" fill="#f8fafc">03 / EXECUTE</text>
        <text x="0" y="44" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0">isolated · idempotent</text>
      </g>
      <g transform="translate(1151 370)">
        <circle r="8" fill="#090d14" stroke="#93c5fd" stroke-width="3"/>
        <text x="0" y="-25" fill="#cbd5e1">04 / PROVE</text>
        <text x="0" y="44" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0">replay · evidence · trust</text>
      </g>
      <g transform="translate(1502 370)">
        <circle r="8" fill="#090d14" stroke="#a78bfa" stroke-width="3"/>
        <text x="0" y="-25" fill="#cbd5e1" text-anchor="end">05 / RECONCILE</text>
        <text x="0" y="44" fill="#64748b" font-size="13" font-weight="500" letter-spacing="0" text-anchor="end">ledger · outcome · feedback</text>
      </g>
    </g>

    <!-- JEV decision dots (connecting to each layer) -->
    <g fill="#fb923c" opacity="0.6">
      <circle cx="98" cy="420" r="4"/>
      <circle cx="449" cy="420" r="4"/>
      <circle cx="800" cy="420" r="4"/>
      <circle cx="1151" cy="420" r="4"/>
      <circle cx="1502" cy="420" r="4"/>
    </g>

    <!-- Vertical connectors from flow to JEV layer -->
    <g stroke="#f97316" stroke-width="1" opacity="0.4" stroke-dasharray="3 3">
      <line x1="98" y1="378" x2="98" y2="416"/>
      <line x1="449" y1="378" x2="449" y2="416"/>
      <line x1="800" y1="378" x2="800" y2="416"/>
      <line x1="1151" y1="378" x2="1151" y2="416"/>
      <line x1="1502" y1="378" x2="1502" y2="416"/>
    </g>

    <!-- GPU fleet indicator -->
    <g transform="translate(98, 480)">
      <text fill="#4ade80" font-size="12" font-weight="600" letter-spacing="2">LOCAL GPU FLEET</text>
      <text x="200" fill="#64748b" font-size="12">V100 16GB</text>
      <circle cx="270" cy="-4" r="3" fill="#4ade80"/>
      <text x="290" fill="#64748b" font-size="12">P40 24GB</text>
      <circle cx="350" cy="-4" r="3" fill="#4ade80"/>
      <text x="370" fill="#64748b" font-size="12">RTX 3060 12GB</text>
      <circle cx="460" cy="-4" r="3" fill="#4ade80"/>
      <text x="480" fill="#64748b" font-size="12">· Ollama 4-lane · ComfyUI · Bend CUDA</text>
    </g>
  </g>
</svg>