<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="trace-title trace-desc">
  <title id="trace-title">Hardonia Deterministic Request Trace — OpenTelemetry &amp; Policy Waterfall</title>
  <desc id="trace-desc">Microsecond waterfall trace of an autonomous AI request traversing PostgreSQL RLS tenant scoping, TokenGoblin quota gating, ReadyLayer MCP single-use token authorization, veridag causal DAG execution, and Settler cryptographic ledger reconciliation.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .playhead {
        animation: sweep 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .span-glow-1 { animation: hi-1 7.5s linear infinite; }
      .span-glow-2 { animation: hi-2 7.5s linear infinite; }
      .span-glow-3 { animation: hi-3 7.5s linear infinite; }
      .span-glow-4 { animation: hi-4 7.5s linear infinite; }
      .span-glow-5 { animation: hi-5 7.5s linear infinite; }

      @keyframes sweep {
        0% { transform: translateX(460px); opacity: 0.9; }
        92% { transform: translateX(1500px); opacity: 0.9; }
        100% { transform: translateX(460px); opacity: 0.2; }
      }
      @keyframes hi-1 {
        0%, 12% { stroke-opacity: 1; fill-opacity: 0.35; }
        15%, 100% { stroke-opacity: 0.55; fill-opacity: 0.16; }
      }
      @keyframes hi-2 {
        0%, 10% { stroke-opacity: 0.55; fill-opacity: 0.16; }
        12%, 24% { stroke-opacity: 1; fill-opacity: 0.35; }
        27%, 100% { stroke-opacity: 0.55; fill-opacity: 0.16; }
      }
      @keyframes hi-3 {
        0%, 22% { stroke-opacity: 0.55; fill-opacity: 0.16; }
        24%, 56% { stroke-opacity: 1; fill-opacity: 0.35; }
        59%, 100% { stroke-opacity: 0.55; fill-opacity: 0.16; }
      }
      @keyframes hi-4 {
        0%, 54% { stroke-opacity: 0.55; fill-opacity: 0.16; }
        56%, 80% { stroke-opacity: 1; fill-opacity: 0.35; }
        83%, 100% { stroke-opacity: 0.55; fill-opacity: 0.16; }
      }
      @keyframes hi-5 {
        0%, 78% { stroke-opacity: 0.55; fill-opacity: 0.16; }
        80%, 95% { stroke-opacity: 1; fill-opacity: 0.35; }
        98%, 100% { stroke-opacity: 0.55; fill-opacity: 0.16; }
      }
      @media (prefers-reduced-motion: reduce) {
        .playhead, .span-glow-1, .span-glow-2, .span-glow-3, .span-glow-4, .span-glow-5 { animation: none; }
      }
      @media (prefers-color-scheme: light) {
        .chassis-border { stroke: #0f172a; stroke-width: 2.5; }
      }
    </style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <linearGradient id="playhead-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Outer Chassis -->
  <rect width="1600" height="520" rx="18" fill="url(#bg-grad)"/>
  <rect width="1600" height="520" rx="18" fill="url(#minor-grid)"/>
  <rect x="1" y="1" width="1598" height="518" rx="17" fill="none" stroke="#1e293b" stroke-width="2" class="chassis-border"/>
  <rect x="12" y="12" width="1576" height="496" rx="11" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Corner Fiducial Crosshairs -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.7">
    <path d="M 24 30 L 36 30 M 30 24 L 30 36"/>
    <path d="M 1564 30 L 1576 30 M 1570 24 L 1570 36"/>
    <path d="M 24 490 L 36 490 M 30 484 L 30 496"/>
    <path d="M 1564 490 L 1576 490 M 1570 484 L 1570 496"/>
  </g>

  <!-- Top Telemetry Header -->
  <g transform="translate(48, 42)">
    <rect x="0" y="-15" width="9" height="17" rx="2" fill="#38bdf8"/>
    <text x="18" y="-1" class="mono" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="2">OTEL // DETERMINISTIC EXECUTION TRACE WATERFALL</text>
    <text x="488" y="-1" class="mono" fill="#64748b" font-size="11.5" letter-spacing="1">│  TRACE_ID: 0x7f9a8c12e402  │  TENANT: t_enterprise_01  │  DURATION: 42.8 ms</text>
    <text x="1504" y="-1" class="mono" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="end" letter-spacing="1.5">STATUS: 200_VERIFIED_REPLAYABLE</text>
  </g>
  <line x1="48" y1="60" x2="1552" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- Timeline Ruler Header -->
  <g transform="translate(0, 86)" class="mono" font-size="10.5" fill="#64748b">
    <text x="58" y="0" fill="#94a3b8" font-weight="700" letter-spacing="1.5">SYSTEM BOUNDARY / SPAN</text>
    <text x="460" y="0" text-anchor="middle">0.0 ms</text>
    <text x="668" y="0" text-anchor="middle">10.0 ms</text>
    <text x="876" y="0" text-anchor="middle">20.0 ms</text>
    <text x="1084" y="0" text-anchor="middle">30.0 ms</text>
    <text x="1292" y="0" text-anchor="middle">40.0 ms</text>
    <text x="1500" y="0" text-anchor="end" fill="#38bdf8">42.8 ms (FINAL)</text>
  </g>
  <line x1="48" y1="98" x2="1552" y2="98" stroke="#1e293b" stroke-width="1"/>

  <!-- Vertical Time Grid Markers -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 5">
    <line x1="460" y1="98" x2="460" y2="442"/>
    <line x1="668" y1="98" x2="668" y2="442"/>
    <line x1="876" y1="98" x2="876" y2="442"/>
    <line x1="1084" y1="98" x2="1084" y2="442"/>
    <line x1="1292" y1="98" x2="1292" y2="442"/>
    <line x1="1500" y1="98" x2="1500" y2="442"/>
  </g>

  <!-- ======================================================================= -->
  <!-- SWIMLANE 01: INGRESS & POSTGRES RLS KERNEL SCOPE                        -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 110)">
    <rect width="1504" height="56" rx="7" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" class="mono" fill="#2dd4bf" font-size="11" font-weight="700">01 // INGRESS &amp; RLS SCOPE</text>
    <text x="16" y="42" class="mono" fill="#64748b" font-size="10.5">Settler · PostgreSQL Kernel</text>

    <!-- Waterfall Span Bar (0.0ms -> 1.8ms) -->
    <rect x="412" y="10" width="96" height="36" rx="5" fill="#2dd4bf" fill-opacity="0.2" stroke="#2dd4bf" stroke-width="1.5" class="span-glow-1"/>
    <text x="424" y="32" class="mono" fill="#99f6e4" font-size="10.5" font-weight="700">1.8 ms</text>
    <text x="524" y="25" class="mono" fill="#e2e8f0" font-size="11" font-weight="600">SET LOCAL app.current_tenant_id = 't_enterprise_01'</text>
    <text x="524" y="42" class="mono" fill="#64748b" font-size="10">FORCE ROW LEVEL SECURITY active · Cross-tenant reads kernel-blocked</text>
  </g>

  <!-- ======================================================================= -->
  <!-- SWIMLANE 02: TOKENGOBLIN QUOTA & ROUTING GATE                           -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 176)">
    <rect width="1504" height="56" rx="7" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" class="mono" fill="#fbbf24" font-size="11" font-weight="700">02 // QUOTA &amp; COST CIRCUIT</text>
    <text x="16" y="42" class="mono" fill="#64748b" font-size="10.5">TokenGoblin · Go Telemetry</text>

    <!-- Waterfall Span Bar (1.8ms -> 4.2ms) -->
    <rect x="508" y="10" width="110" height="36" rx="5" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" class="span-glow-2"/>
    <text x="520" y="32" class="mono" fill="#fde68a" font-size="10.5" font-weight="700">2.4 ms</text>
    <text x="634" y="25" class="mono" fill="#e2e8f0" font-size="11" font-weight="600">budget.check(18,420 / 50,000 tok) ──► ALLOW · route: v100-fp16</text>
    <text x="634" y="42" class="mono" fill="#64748b" font-size="10">Sub-millisecond token accounting · Hard spend ceiling enforced before model call</text>
  </g>

  <!-- ======================================================================= -->
  <!-- SWIMLANE 03: UNPRIVILEGED PLANNER & READYLAYER MCP GATEWAY              -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 242)">
    <rect width="1504" height="56" rx="7" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" class="mono" fill="#38bdf8" font-size="11" font-weight="700">03 // MCP POLICY GATEWAY</text>
    <text x="16" y="42" class="mono" fill="#64748b" font-size="10.5">ReadyLayer · agent-infra</text>

    <!-- Waterfall Span Bar (4.2ms -> 24.6ms) -->
    <rect x="618" y="10" width="380" height="36" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" class="span-glow-3"/>
    <text x="632" y="32" class="mono" fill="#bae6fd" font-size="10.5" font-weight="700">20.4 ms · Intent: ledger.reconcile_batch</text>
    <text x="1014" y="25" class="mono" fill="#e2e8f0" font-size="11" font-weight="600">Policy pol_strict_v4 PASSED · Minted 1-use token cap_01J9X</text>
    <text x="1014" y="42" class="mono" fill="#64748b" font-size="10">Unprivileged planner holds 0 credentials · Schema &amp; capability scope verified</text>
  </g>

  <!-- ======================================================================= -->
  <!-- SWIMLANE 04: VERIDAG CAUSAL DAG EXECUTION                               -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 308)">
    <rect width="1504" height="56" rx="7" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" class="mono" fill="#818cf8" font-size="11" font-weight="700">04 // CAUSAL DAG EXECUTION</text>
    <text x="16" y="42" class="mono" fill="#64748b" font-size="10.5">veridag · Rust + Quint Spec</text>

    <!-- Waterfall Span Bar (24.6ms -> 37.4ms) -->
    <rect x="998" y="10" width="268" height="36" rx="5" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" class="span-glow-4"/>
    <text x="1012" y="32" class="mono" fill="#e0e7ff" font-size="10.5" font-weight="700">12.8 ms · DAG Node v2 ──► v3</text>
    <text x="524" y="25" class="mono" fill="#94a3b8" font-size="10.5">Idempotency Lock: idem_7c2e91 · Preconditions: [v0, v1, v2] COMPLETE</text>
    <text x="524" y="42" class="mono" fill="#64748b" font-size="10">State transition conforms to Quint formal specification · Safe under retry</text>
  </g>

  <!-- ======================================================================= -->
  <!-- SWIMLANE 05: SETTLER CRYPTOGRAPHIC AUDIT & LEDGER FINALITY              -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 374)">
    <rect width="1504" height="56" rx="7" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" class="mono" fill="#34d399" font-size="11" font-weight="700">05 // PROOF &amp; RECONCILE</text>
    <text x="16" y="42" class="mono" fill="#64748b" font-size="10.5">Settler · Audit Chain</text>

    <!-- Waterfall Span Bar (37.4ms -> 42.8ms) -->
    <rect x="1266" y="10" width="186" height="36" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" class="span-glow-5"/>
    <text x="1280" y="32" class="mono" fill="#a7f3d0" font-size="10.5" font-weight="700">5.4 ms · SEALED ✓</text>
    <text x="524" y="25" class="mono" fill="#34d399" font-size="11" font-weight="600">SHA-256 Merkle Leaf: 0x9f4b8c...e21a · Ledger Drift: 0.00</text>
    <text x="524" y="42" class="mono" fill="#64748b" font-size="10">Deterministic replay log persisted · Ready for independent verification</text>
  </g>

  <!-- Sweeping Playhead Cursor -->
  <g class="playhead">
    <line x1="0" y1="98" x2="0" y2="442" stroke="url(#playhead-grad)" stroke-width="2"/>
    <polygon points="-6,98 6,98 0,106" fill="#38bdf8"/>
  </g>

  <!-- Bottom Telemetry Readout Bar -->
  <g transform="translate(48, 456)">
    <rect width="1504" height="36" rx="6" fill="#070a10" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="18" r="4" fill="#34d399"/>
    <text x="32" y="22" class="mono" fill="#cbd5e1" font-size="11" font-weight="600">INVARIANT ASSERTIONS:</text>
    <text x="204" y="22" class="mono" fill="#2dd4bf" font-size="11">RLS_ISOLATION=PASS</text>
    <text x="372" y="22" class="mono" fill="#fbbf24" font-size="11">QUOTA_GATE=PASS</text>
    <text x="520" y="22" class="mono" fill="#38bdf8" font-size="11">MCP_CAPABILITY=1_USE_TOKEN</text>
    <text x="748" y="22" class="mono" fill="#818cf8" font-size="11">CAUSAL_ORDER=QUINT_VALID</text>
    <text x="964" y="22" class="mono" fill="#34d399" font-size="11">REPLAY_HASH=0x9f4b8ce21a</text>
    <text x="1488" y="22" class="mono" fill="#64748b" font-size="10.5" text-anchor="end">ZERO UNPRIVILEGED SIDE EFFECTS</text>
  </g>
</svg>
