<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="370" viewBox="0 0 1600 370" role="img" aria-labelledby="shelf-title shelf-desc">
  <title id="shelf-title">Hardonia Technical Writing &amp; Architecture Monographs</title>
  <desc id="shelf-desc">Four architectural monographs covering Multi-Tenant AI Agents with PostgreSQL RLS, Enterprise Tool Calling via MCP Reverse Proxies, Prototype to Production Enterprise Agent Architecture, and the Hardonia Architecture Playbook.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @media (prefers-color-scheme: light) {
        .chassis-border { stroke: #0f172a; stroke-width: 2.5; }
      }
    </style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0.98"/>
    </linearGradient>

    <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Outer Chassis -->
  <rect width="1600" height="370" rx="18" fill="url(#bg-grad)"/>
  <rect width="1600" height="370" rx="18" fill="url(#minor-grid)"/>
  <rect x="1" y="1" width="1598" height="368" rx="17" fill="none" stroke="#1e293b" stroke-width="2" class="chassis-border"/>
  <rect x="12" y="12" width="1576" height="346" rx="11" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Header -->
  <g transform="translate(48, 42)">
    <rect x="0" y="-15" width="9" height="17" rx="2" fill="#818cf8"/>
    <text x="18" y="-1" class="mono" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="2.5">ARCHITECTURAL MONOGRAPHS // PRODUCTION AI SYSTEMS DESIGN</text>
    <text x="1504" y="-1" class="mono" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="end" letter-spacing="1.2">GROUNDED IN PUBLIC REPOSITORY IMPLEMENTATIONS</text>
  </g>
  <line x1="48" y1="60" x2="1552" y2="60" stroke="#1e293b" stroke-width="1"/>

  <!-- ======================================================================= -->
  <!-- MONOGRAPH 01: POSTGRES RLS                                              -->
  <!-- ======================================================================= -->
  <g transform="translate(48, 78)">
    <rect width="360" height="246" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#34d399"/>

    <text x="20" y="28" class="mono" fill="#34d399" font-size="10.5" font-weight="700" letter-spacing="1.5">MONOGRAPH 01 // KERNEL SECURITY</text>
    <text x="20" y="54" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Safe Multi-Tenant AI Agents</text>
    <text x="20" y="75" class="sans" fill="#f8fafc" font-size="17" font-weight="700">with PostgreSQL RLS</text>

    <!-- Mini Diagram -->
    <g transform="translate(20, 92)">
      <rect width="320" height="84" rx="6" fill="#060911" stroke="#1e293b"/>
      <rect x="14" y="16" width="116" height="52" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="72" y="38" class="mono" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">AGENT QUERY</text>
      <text x="72" y="54" class="mono" fill="#f43f5e" font-size="8.5" text-anchor="middle">Missing WHERE</text>

      <line x1="130" y1="42" x2="176" y2="42" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

      <rect x="176" y="16" width="130" height="52" rx="4" fill="#062019" stroke="#10b981"/>
      <text x="241" y="38" class="mono" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">PG RLS POLICY</text>
      <text x="241" y="54" class="mono" fill="#6ee7b7" font-size="8.5" text-anchor="middle">Tenant Enforced</text>
    </g>

    <text x="20" y="202" class="sans" fill="#94a3b8" font-size="12">Why app-layer filtering fails in agent loops</text>
    <text x="20" y="220" class="mono" fill="#34d399" font-size="10.5" font-weight="600">READ PAPER 01 ──►</text>
  </g>

  <!-- ======================================================================= -->
  <!-- MONOGRAPH 02: ENTERPRISE TOOL CALLING (MCP)                             -->
  <!-- ======================================================================= -->
  <g transform="translate(430, 78)">
    <rect width="360" height="246" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#38bdf8"/>

    <text x="20" y="28" class="mono" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.5">MONOGRAPH 02 // CAPABILITY GATES</text>
    <text x="20" y="54" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Enterprise Tool Calling: Auth</text>
    <text x="20" y="75" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Outside the Model</text>

    <!-- Mini Diagram -->
    <g transform="translate(20, 92)">
      <rect width="320" height="84" rx="6" fill="#060911" stroke="#1e293b"/>
      <rect x="14" y="16" width="90" height="52" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="59" y="40" class="mono" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">PLANNER</text>
      <text x="59" y="54" class="mono" fill="#64748b" font-size="8.5" text-anchor="middle">0 Secrets</text>

      <line x1="104" y1="42" x2="128" y2="42" stroke="#38bdf8" stroke-width="1.5"/>

      <rect x="128" y="16" width="84" height="52" rx="4" fill="#0c1928" stroke="#38bdf8"/>
      <text x="170" y="40" class="mono" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">MCP PROXY</text>
      <text x="170" y="54" class="mono" fill="#7dd3fc" font-size="8.5" text-anchor="middle">1-Use Token</text>

      <line x1="212" y1="42" x2="236" y2="42" stroke="#34d399" stroke-width="1.5"/>

      <rect x="236" y="16" width="70" height="52" rx="4" fill="#062019" stroke="#10b981"/>
      <text x="271" y="45" class="mono" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">EXECUTE</text>
    </g>

    <text x="20" y="202" class="sans" fill="#94a3b8" font-size="12">Policy-gated MCP proxies &amp; approval tokens</text>
    <text x="20" y="220" class="mono" fill="#38bdf8" font-size="10.5" font-weight="600">READ PAPER 02 ──►</text>
  </g>

  <!-- ======================================================================= -->
  <!-- MONOGRAPH 03: PROTOTYPE TO PRODUCTION                                   -->
  <!-- ======================================================================= -->
  <g transform="translate(812, 78)">
    <rect width="360" height="246" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="#fbbf24"/>

    <text x="20" y="28" class="mono" fill="#fbbf24" font-size="10.5" font-weight="700" letter-spacing="1.5">MONOGRAPH 03 // PRODUCTION OPS</text>
    <text x="20" y="54" class="sans" fill="#f8fafc" font-size="17" font-weight="700">From Prototype to Production:</text>
    <text x="20" y="75" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Enterprise AI Agents</text>

    <!-- Mini Diagram -->
    <g transform="translate(20, 92)">
      <rect width="320" height="84" rx="6" fill="#060911" stroke="#1e293b"/>
      <text x="18" y="28" class="mono" fill="#fbbf24" font-size="9.5" font-weight="700">CI EVALS + QUOTA GOVERNANCE</text>
      <rect x="18" y="38" width="88" height="28" rx="4" fill="#231605" stroke="#d97706"/>
      <text x="62" y="56" class="mono" fill="#fde68a" font-size="9" text-anchor="middle">Eval Gate</text>
      <rect x="116" y="38" width="88" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="160" y="56" class="mono" fill="#cbd5e1" font-size="9" text-anchor="middle">OTel Trace</text>
      <rect x="214" y="38" width="88" height="28" rx="4" fill="#062019" stroke="#10b981"/>
      <text x="258" y="56" class="mono" fill="#6ee7b7" font-size="9" text-anchor="middle">Spend Cap</text>
    </g>

    <text x="20" y="202" class="sans" fill="#94a3b8" font-size="12">Execution boundaries, CI evals &amp; spend control</text>
    <text x="20" y="220" class="mono" fill="#fbbf24" font-size="10.5" font-weight="600">READ PAPER 03 ──►</text>
  </g>

  <!-- ======================================================================= -->
  <!-- MONOGRAPH 04: HARDONIA ARCHITECTURE PLAYBOOK                            -->
  <!-- ======================================================================= -->
  <g transform="translate(1194, 78)">
    <rect width="358" height="246" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="358" height="3" rx="1.5" fill="#818cf8"/>

    <text x="20" y="28" class="mono" fill="#818cf8" font-size="10.5" font-weight="700" letter-spacing="1.5">MONOGRAPH 04 // SYSTEM TOPOLOGY</text>
    <text x="20" y="54" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Hardonia Architecture</text>
    <text x="20" y="75" class="sans" fill="#f8fafc" font-size="17" font-weight="700">Playbook &amp; Operating Loops</text>

    <!-- Mini Diagram -->
    <g transform="translate(20, 92)">
      <rect width="318" height="84" rx="6" fill="#060911" stroke="#1e293b"/>
      <text x="159" y="28" class="mono" fill="#a5b4fc" font-size="9.5" font-weight="700" text-anchor="middle">CLOSED-LOOP CONTROL TOPOLOGY</text>
      <line x1="34" y1="54" x2="284" y2="54" stroke="#818cf8" stroke-width="2"/>
      <circle cx="44" cy="54" r="6" fill="#2dd4bf"/>
      <circle cx="102" cy="54" r="6" fill="#38bdf8"/>
      <circle cx="160" cy="54" r="6" fill="#818cf8"/>
      <circle cx="218" cy="54" r="6" fill="#c084fc"/>
      <circle cx="276" cy="54" r="6" fill="#34d399"/>
    </g>

    <text x="20" y="202" class="sans" fill="#94a3b8" font-size="12">Bounded contexts, cutover gates &amp; verification</text>
    <text x="20" y="220" class="mono" fill="#818cf8" font-size="10.5" font-weight="600">READ PLAYBOOK ──►</text>
  </g>
</svg>

